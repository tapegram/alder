# Written by `alder ci init` (book chapter 16). The pipeline is alder's own commands: what
# runs here runs the same from a laptop.
#
#   pull request   alder check; alder test --mutate --min 0.9; alder deploy preview --host
#                  <number>.preview.example.com, and a comment with its address
#   push to main   alder check; alder test --mutate --min 0.9; alder deploy production
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   RENDER_API_KEY        a Render API key of the workspace that owns the service
#   TURSO_API_TOKEN       a Turso API token of the organization acme: turso auth api-tokens mint alder-ci
#   ALDER_REGISTRY_TOKEN  a personal access token with read:packages and write:packages (see below)
#   SSH_PRIVATE_KEY       a private key deploy@box.example.com accepts (preview)
#   SSH_KNOWN_HOSTS       the host key lines of box.example.com: ssh-keyscan box.example.com
#   SMTP_URL              named in App's `requires`; production reads it here
#   ALDER_SECRET          the session key (16 bytes or more) of production
#
# Not repository secrets: SMTP_URL, ALDER_SECRET of preview live in the box's environment file
# (<path>/env, NAME=value lines); `alder deploy` checks that they are set there.
#
# ALDER_REGISTRY_TOKEN must be a personal access token with `read:packages` and
# `write:packages`, not the job's own token (`github.token`): alder pushes the image with it and
# keeps Render's registry credential set to it, and Render pulls the image with that credential
# on every deploy and every restart, long after a run's token has expired.
#
# The first deploy creates the Render service (`alder deploy` does it, from App's `deploy`), so
# Render's dashboard is for looking.
#
# A preview stays up after its pull request is closed: remove it by hand for now.
name: alder

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ALDER_VERSION: v0.3.0

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install alder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ALDER_VERSION" --repo tapegram/alder --pattern 'alder_*_linux_amd64.tar.gz' --output "$RUNNER_TEMP/alder.tar.gz"
          tar -xzf "$RUNNER_TEMP/alder.tar.gz" -C "$RUNNER_TEMP" alder
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: alder check
      - run: alder test --mutate --min 0.9

  preview:
    # a pull request from a fork gets no secrets: it is checked, not deployed
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
    env:
      HOST: ${{ github.event.pull_request.number }}.preview.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install alder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ALDER_VERSION" --repo tapegram/alder --pattern 'alder_*_linux_amd64.tar.gz' --output "$RUNNER_TEMP/alder.tar.gz"
          tar -xzf "$RUNNER_TEMP/alder.tar.gz" -C "$RUNNER_TEMP" alder
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
      - name: alder deploy preview
        run: alder deploy preview --host "$HOST"
      - name: Comment the address
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="Preview of $SHA: https://$HOST"
          gh pr comment "$PR" --edit-last --body "$body" || gh pr comment "$PR" --body "$body"

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install alder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ALDER_VERSION" --repo tapegram/alder --pattern 'alder_*_linux_amd64.tar.gz' --output "$RUNNER_TEMP/alder.tar.gz"
          tar -xzf "$RUNNER_TEMP/alder.tar.gz" -C "$RUNNER_TEMP" alder
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: alder deploy production
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          ALDER_REGISTRY_TOKEN: ${{ secrets.ALDER_REGISTRY_TOKEN }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          ALDER_SECRET: ${{ secrets.ALDER_SECRET }}
        run: alder deploy production
