# Written by `alder ci init` (book chapter 16). The pipeline is alder's own commands: what
# runs here runs the same from a laptop.
#
#   pull request   alder check; alder test --mutate; alder deploy preview, and a comment with
#                  its address
#   push to main   alder check; alder test --mutate; alder deploy production
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   FLY_API_TOKEN  a token that deploys the Fly apps blog and blog-preview: fly tokens create org
#   SMTP_URL       named in App's `requires`; production and preview read it here
#   ALDER_SECRET   the session key (32 bytes or more) of production and preview
#
# Every pull request deploys to the one Fly app blog-preview: the last push wins.
# A preview stays up after its pull request is closed: remove it by hand for now.
#
# No `floor` is declared: `alder deploy` holds the score to the last deploy's.
name: alder

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ALDER_VERSION: v0.2.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install alder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ALDER_VERSION" --repo tapegram/alder --pattern 'alder_*_linux_amd64.tar.gz' --output "$RUNNER_TEMP/alder.tar.gz"
          tar -xzf "$RUNNER_TEMP/alder.tar.gz" -C "$RUNNER_TEMP" alder
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: alder check
      - run: alder test --mutate

  preview:
    # a pull request from a fork gets no secrets: it is checked, not deployed
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install alder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ALDER_VERSION" --repo tapegram/alder --pattern 'alder_*_linux_amd64.tar.gz' --output "$RUNNER_TEMP/alder.tar.gz"
          tar -xzf "$RUNNER_TEMP/alder.tar.gz" -C "$RUNNER_TEMP" alder
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: alder deploy preview
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          ALDER_SECRET: ${{ secrets.ALDER_SECRET }}
        run: alder deploy preview
      - name: Comment the address
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="Preview of $SHA: https://blog-preview.fly.dev"
          gh pr comment "$PR" --edit-last --body "$body" || gh pr comment "$PR" --body "$body"

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install alder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$ALDER_VERSION" --repo tapegram/alder --pattern 'alder_*_linux_amd64.tar.gz' --output "$RUNNER_TEMP/alder.tar.gz"
          tar -xzf "$RUNNER_TEMP/alder.tar.gz" -C "$RUNNER_TEMP" alder
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: alder deploy production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SMTP_URL: ${{ secrets.SMTP_URL }}
          ALDER_SECRET: ${{ secrets.ALDER_SECRET }}
        run: alder deploy production
