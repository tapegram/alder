# The gate on every push (book chapter 11, "Cutting a release", and the M10 plan's Global
# Constraints). Branches are pushed directly, so a branch's push is its CI run; a pull request
# from this repository is skipped (its branch's push already ran), forks' pull requests run. A
# branch's new push cancels its running CI; on main every commit gets its full run. The runner
# installs Go only: anything that still depends on a checkout of this repository at a fixed path
# fails here (TestDist_OutOfTree builds both examples from a temporary directory with only the
# alder binary and go on PATH).
#
# `changes` runs first and says what the push touched, so a docs-only push does not run the
# suite: `code` (anything but docs/, book/, .superpowers/, LICENSE and root-level markdown files;
# book/15-generators.md counts too, a test reads it), `book`, and `deploy` (the deploy code, the
# Dockerfile, this file). A docs-only push to main therefore runs no jobs; the nightly covers main. Scheduled, manual and tag runs have no
# diff and count as changing everything. Then `warm` runs and caches the build; then, in
# parallel: `lint` (gofmt, vet, the Python tests), `test` (go test in six parts:
# cmd/alder's tests in four shards, internal/gen, the rest), `examples` (check, build and test
# both example apps with the built binary), `deploy` (the Ssh target's tests against a Docker
# sshd: go test -tags deploy) and `deploy-systemd` (the default production path: systemd units
# and a real Caddy, on the runner's own VM); the two deploy jobs run on main, tags, the nightly
# run and when a deploy path changed. `mutation` (the mutation quality gates, too slow for every
# push) runs nightly at 03:00 New York time, on a manual run and on tags.
#
# Branch pushes run on Linux only; pushes to main and tags also run `warm`, `test` and
# `examples` on macOS (the `os` lists below), so a release is tested on both.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * *" # 03:00 New York (EDT): the nightly run, with the mutation gates
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # on main every commit has a group of its own, so no run replaces another (even a pending one);
  # a branch's new push replaces its running CI
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # What the push changed, so a docs-only push does not run the 30-minute suite. Pull requests
  # from this repository are skipped here (and so everything after): the branch's push runs CI.
  # A scheduled, manual or tag run has no diff and counts as changing everything.
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a fork pull request's files through the API
    outputs:
      code: ${{ steps.all.outputs.all == 'true' || steps.filter.outputs.code == 'true' || steps.paths.outputs.drill == 'true' }}
      book: ${{ steps.all.outputs.all == 'true' || steps.paths.outputs.book == 'true' }}
      deploy: ${{ steps.all.outputs.all == 'true' || github.ref == 'refs/heads/main' || steps.paths.outputs.deploy == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - id: all
        run: echo "all=${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}" >> "$GITHUB_OUTPUT"
      # Two steps, because predicate-quantifier applies to every filter of a step: `code` needs
      # `every` (all its patterns must hold, the negations included), the others need the default
      # `some`.
      - id: filter
        if: steps.all.outputs.all != 'true'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!book/**'
              - '!.superpowers/**'
              - '!LICENSE'
      - id: paths
        if: steps.all.outputs.all != 'true'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            drill:
              - 'book/15-generators.md'
            book:
              - 'book/**'
            deploy:
              - 'cmd/alder/deploy*'
              - 'cmd/alder/testdata/deploy/**'
              - 'internal/deploy/**'
              - 'rt/backup/**'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'

  # Fills the Go build cache (GOCACHE) and the module cache once per OS and commit, and saves
  # them under a key naming the commit; every other job restores them first (falling back to
  # the newest cache for the same go.sum). setup-go's own cache is keyed by go.sum alone, so it
  # was saved once, by whichever job finished first, and never updated again.
  warm:
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.book == 'true'
    name: warm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: build everything, the test binaries included
        run: |
          go build ./...
          go vet ./...
          go test -count=1 -run '^$' ./... > /dev/null
          go build -o "$RUNNER_TEMP/alder" ./cmd/alder
      - name: build examples/todos (the generated app's dependencies, modernc's sqlite among them)
        working-directory: examples/todos
        run: $RUNNER_TEMP/alder build .
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}

  lint:
    needs: [changes, warm]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.book == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "gofmt -l lists:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: experiments (python3 -m unittest)
        working-directory: experiments
        run: python3 -m unittest
      - name: docs site (book/site/test_site.py)
        run: python3 book/site/test_site.py

  test:
    needs: [changes, warm]
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.book == 'true'
    name: test (${{ matrix.os }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    # CI runners are about 2-4x slower than the laptop the shard weights come from, and the
    # mutation gates are no longer in these shards (see the `mutation` job)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        # cmd/alder's tests share the process's working directory (t.Chdir), so they run one at a
        # time; four jobs split them by measured weight (.github/shard.sh). internal/gen is the
        # next slowest.
        part: [cmd/alder 0/4, cmd/alder 1/4, cmd/alder 2/4, cmd/alder 3/4, internal/gen, rest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: every cmd/alder test is in exactly one shard
        if: matrix.part == 'cmd/alder 0/4' && needs.changes.outputs.code == 'true'
        run: .github/shard.sh 4 check
      - name: go test ./cmd/alder, one shard (TestDist_OutOfTree is in one of them)
        if: startsWith(matrix.part, 'cmd/alder ') && needs.changes.outputs.code == 'true'
        run: |
          part='${{ matrix.part }}'; k=${part#cmd/alder }; k=${k%/4}
          .github/shard.sh 4 "$k"
      - name: go test ./internal/gen
        if: matrix.part == 'internal/gen' && needs.changes.outputs.code == 'true'
        run: go test ./internal/gen -count=1 -timeout 30m
      - name: go test (every other package, the book included)
        if: matrix.part == 'rest'
        run: go test $(go list ./... | grep -v -e '^alder/cmd/alder$' -e '^alder/internal/gen$') -count=1 -timeout 30m

  examples:
    needs: [changes, warm]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: build alder
        run: |
          go build -o "$RUNNER_TEMP/bin/alder" ./cmd/alder
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: alder version
      - name: examples/todos
        working-directory: examples/todos
        run: alder check . && alder build . && alder test .
      - name: examples/blog
        working-directory: examples/blog
        run: alder check . && alder build . && alder test .

  # The Ssh target of `alder deploy` against a real sshd: cmd/alder's TestDeploySsh_* under
  # -tags deploy start a container from cmd/alder/testdata/deploy/Dockerfile (Debian, sshd, curl,
  # a user `deploy`) and deploy the scaffold to it over ssh (deploy_ssh_test.go), behind a fake
  # Caddy for the drain-window tests (deploy_caddy_test.go). Without Docker
  # the job fails (ALDER_DEPLOY_REQUIRE_DOCKER) unless the pull request is labelled no-docker;
  # the default suite runs the same tests against a loopback box. Runs on main, tags, the nightly
  # and manual runs, and when a deploy path changed (`changes`).
  deploy:
    needs: [changes, warm]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      # Docker is part of this job: without it the job fails, unless the pull request carries the
      # label no-docker (then the tests skip, saying so)
      - name: Docker
        env:
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'no-docker') }}
        run: |
          if docker info --format 'Docker {{.ServerVersion}}'; then exit 0; fi
          if [ "$SKIP" = true ]; then echo "::notice::no Docker, and the no-docker label: the deploy tests skip"; exit 0; fi
          echo "::error::Docker does not answer on this runner: the Ssh target's tests cannot run (label the pull request no-docker to skip them)"
          exit 1
      - name: go vet -tags deploy
        run: go vet -tags deploy ./cmd/alder
      - name: go test -tags deploy (the Ssh target against a Docker sshd)
        env:
          ALDER_DEPLOY_REQUIRE_DOCKER: ${{ !contains(github.event.pull_request.labels.*.name, 'no-docker') && '1' || '' }}
        run: go test -tags deploy ./cmd/alder -run '^TestDeploySsh_' -count=1 -timeout 20m -v

  # The default production path end to end, which the container cannot run: systemd as PID 1
  # (a GitHub runner is a VM with systemd and passwordless sudo) and a real Caddy, installed by
  # the Ssh target itself with apt on the first deploy (with its --resume drop-in). The test
  # (cmd/alder/deploy_systemd_test.go) reaches the runner over ssh as root@127.0.0.1 and Caddy
  # at https://localhost: two deploys under an availability monitor, Caddy restarted, a killed
  # build restarted by systemd, a rollback with --restore-backup. Runs when `deploy` does.
  deploy-systemd:
    needs: [changes, warm]
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: sshd, and a key root accepts from 127.0.0.1
        run: |
          sudo apt-get update -q
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
          sudo systemctl start ssh
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/box_key"
          sudo install -d -m 700 /root/.ssh
          sudo tee -a /root/.ssh/authorized_keys < "$RUNNER_TEMP/box_key.pub" > /dev/null
          sudo chmod 600 /root/.ssh/authorized_keys
          printf 'Host alder-systemd-box\n  HostName 127.0.0.1\n  User root\n  IdentityFile %s\n  IdentitiesOnly yes\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  LogLevel ERROR\n' "$RUNNER_TEMP/box_key" > "$RUNNER_TEMP/ssh_config"
          ssh -F "$RUNNER_TEMP/ssh_config" alder-systemd-box 'id -un; systemctl is-system-running || true'
      - name: go test (systemd units and a real Caddy)
        env:
          ALDER_DEPLOY_SYSTEMD: "1"
          ALDER_SSH_CONFIG: ${{ runner.temp }}/ssh_config
        run: go test ./cmd/alder -run '^TestDeploySystemd_' -count=1 -timeout 15m -v

  # The mutation quality gates (cmd/alder/gates_test.go): every mutant of the admin fixtures and
  # the example apps, against the scores and mutant counts the examples record. Nightly, on a
  # manual run and on tags: they are too slow for every push.
  mutation:
    needs: [changes, warm]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: go test the mutation gates
        env:
          ALDER_MUTATION_GATES: "1"
        run: go test ./cmd/alder -run '^(TestAdmin_Columns|TestAdmin_Mutate|TestExample_Blog|TestExample_Workspace|TestExample_TodosMutation)$' -count=1 -timeout 40m -v
