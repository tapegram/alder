# The gate on every push and pull request (book chapter 11, "Cutting a release", and the M10
# plan's Global Constraints). The runner installs Go only: anything that still depends on a
# checkout of this repository at a fixed path fails here (TestDist_OutOfTree builds both examples
# from a temporary directory with only the alder binary and go on PATH).
#
# Jobs run in parallel: `lint` (gofmt, vet, the Python tests), `test` (go test, split in two
# because cmd/alder's tests take most of the time) and `examples` (check, build and test both
# example apps with the built binary), the last two on Linux and macOS.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fills the Go build cache (GOCACHE) and the module cache once per OS and commit, and saves
  # them under a key naming the commit; every other job restores them first (falling back to
  # the newest cache for the same go.sum). setup-go's own cache is keyed by go.sum alone, so it
  # was saved once, by whichever job finished first, and never updated again.
  warm:
    name: warm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: build everything, the test binaries included
        run: |
          go build ./...
          go vet ./...
          go test -count=1 -run '^$' ./... > /dev/null
          go build -o "$RUNNER_TEMP/alder" ./cmd/alder
      - name: build examples/todos (the generated app's dependencies, modernc's sqlite among them)
        working-directory: examples/todos
        run: $RUNNER_TEMP/alder build .
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}

  lint:
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "gofmt -l lists:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: experiments (python3 -m unittest)
        working-directory: experiments
        run: python3 -m unittest
      - name: docs site (book/site/test_site.py)
        run: python3 book/site/test_site.py

  test:
    needs: warm
    name: test (${{ matrix.os }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        part: [cmd/alder, rest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: go test ./cmd/alder (includes TestDist_OutOfTree)
        if: matrix.part == 'cmd/alder'
        run: go test ./cmd/alder -count=1
      - name: go test (every other package, the book included)
        if: matrix.part == 'rest'
        run: go test $(go list ./... | grep -v '^alder/cmd/alder$') -count=1

  examples:
    needs: warm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: build alder
        run: |
          go build -o "$RUNNER_TEMP/bin/alder" ./cmd/alder
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: alder version
      - name: examples/todos
        working-directory: examples/todos
        run: alder check . && alder build . && alder test .
      - name: examples/blog
        working-directory: examples/blog
        run: alder check . && alder build . && alder test .
