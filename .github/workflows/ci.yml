# The gate on every push and pull request (book chapter 11, "Cutting a release", and the M10
# plan's Global Constraints). The runner installs Go only: anything that still depends on a
# checkout of this repository at a fixed path fails here (TestDist_OutOfTree builds both examples
# from a temporary directory with only the alder binary and go on PATH).
#
# `warm` runs first and caches the build; then, in parallel: `lint` (gofmt, vet, the Python
# tests), `test` (go test in five parts: cmd/alder's tests in three shards, internal/gen, the
# rest), `examples` (check, build and test both example apps with the built binary) and
# `deploy` (the Ssh target's tests against a Docker sshd: go test -tags deploy), and
# `deploy-systemd` (the default production path: systemd units and a real Caddy, on the
# runner's own VM).
#
# Branch pushes and pull requests run on Linux only; pushes to main and tags also run `warm`,
# `test` and `examples` on macOS (the `os` lists below), so a release is tested on both.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fills the Go build cache (GOCACHE) and the module cache once per OS and commit, and saves
  # them under a key naming the commit; every other job restores them first (falling back to
  # the newest cache for the same go.sum). setup-go's own cache is keyed by go.sum alone, so it
  # was saved once, by whichever job finished first, and never updated again.
  warm:
    name: warm (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: build everything, the test binaries included
        run: |
          go build ./...
          go vet ./...
          go test -count=1 -run '^$' ./... > /dev/null
          go build -o "$RUNNER_TEMP/alder" ./cmd/alder
      - name: build examples/todos (the generated app's dependencies, modernc's sqlite among them)
        working-directory: examples/todos
        run: $RUNNER_TEMP/alder build .
      - uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}

  lint:
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: gofmt
        run: |
          out=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$out" ]; then echo "gofmt -l lists:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: experiments (python3 -m unittest)
        working-directory: experiments
        run: python3 -m unittest
      - name: docs site (book/site/test_site.py)
        run: python3 book/site/test_site.py

  test:
    needs: warm
    name: test (${{ matrix.os }}, ${{ matrix.part }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        # cmd/alder's tests share the process's working directory (t.Chdir), so they run one at a
        # time; three jobs split them by name (.github/shard.sh). internal/gen is the next slowest.
        part: [cmd/alder 0/3, cmd/alder 1/3, cmd/alder 2/3, internal/gen, rest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: every cmd/alder test is in exactly one shard
        if: matrix.part == 'cmd/alder 0/3'
        run: .github/shard.sh 3 check
      - name: go test ./cmd/alder, one shard (TestDist_OutOfTree is in one of them)
        if: startsWith(matrix.part, 'cmd/alder ')
        run: |
          part='${{ matrix.part }}'; k=${part#cmd/alder }; k=${k%/3}
          .github/shard.sh 3 "$k"
      - name: go test ./internal/gen
        if: matrix.part == 'internal/gen'
        run: go test ./internal/gen -count=1 -timeout 30m
      - name: go test (every other package, the book included)
        if: matrix.part == 'rest'
        run: go test $(go list ./... | grep -v -e '^alder/cmd/alder$' -e '^alder/internal/gen$') -count=1 -timeout 30m

  examples:
    needs: warm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: build alder
        run: |
          go build -o "$RUNNER_TEMP/bin/alder" ./cmd/alder
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: alder version
      - name: examples/todos
        working-directory: examples/todos
        run: alder check . && alder build . && alder test .
      - name: examples/blog
        working-directory: examples/blog
        run: alder check . && alder build . && alder test .

  # The Ssh target of `alder deploy` against a real sshd: cmd/alder's TestDeploySsh_* under
  # -tags deploy start a container from cmd/alder/testdata/deploy/Dockerfile (Debian, sshd, curl,
  # a user `deploy`) and deploy the scaffold to it over ssh (deploy_ssh_test.go), behind a fake
  # Caddy for the drain-window tests (deploy_caddy_test.go). Without Docker
  # the job fails (ALDER_DEPLOY_REQUIRE_DOCKER) unless the pull request is labelled no-docker;
  # the default suite runs the same tests against a loopback box.
  deploy:
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      # Docker is part of this job: without it the job fails, unless the pull request carries the
      # label no-docker (then the tests skip, saying so)
      - name: Docker
        env:
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'no-docker') }}
        run: |
          if docker info --format 'Docker {{.ServerVersion}}'; then exit 0; fi
          if [ "$SKIP" = true ]; then echo "::notice::no Docker, and the no-docker label: the deploy tests skip"; exit 0; fi
          echo "::error::Docker does not answer on this runner: the Ssh target's tests cannot run (label the pull request no-docker to skip them)"
          exit 1
      - name: go vet -tags deploy
        run: go vet -tags deploy ./cmd/alder
      - name: go test -tags deploy (the Ssh target against a Docker sshd)
        env:
          ALDER_DEPLOY_REQUIRE_DOCKER: ${{ !contains(github.event.pull_request.labels.*.name, 'no-docker') && '1' || '' }}
        run: go test -tags deploy ./cmd/alder -run '^TestDeploySsh_' -count=1 -timeout 20m -v

  # The default production path end to end, which the container cannot run: systemd as PID 1
  # (a GitHub runner is a VM with systemd and passwordless sudo) and a real Caddy, installed by
  # the Ssh target itself with apt on the first deploy (with its --resume drop-in). The test
  # (cmd/alder/deploy_systemd_test.go) reaches the runner over ssh as root@127.0.0.1 and Caddy
  # at https://localhost: two deploys under an availability monitor, Caddy restarted, a killed
  # build restarted by systemd, a rollback with --restore-backup.
  # Non-blocking for now (continue-on-error: written in the M14 final fix wave without a runner
  # to try it on); a failure still shows: the last step writes a ::warning:: annotation and a job
  # summary line.
  # TODO(2026-10-17, M14): drop `continue-on-error: true` after the first green run on main.
  deploy-systemd:
    needs: warm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}-
      - name: sshd, and a key root accepts from 127.0.0.1
        run: |
          sudo apt-get update -q
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -q openssh-server
          sudo systemctl start ssh
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/box_key"
          sudo install -d -m 700 /root/.ssh
          sudo tee -a /root/.ssh/authorized_keys < "$RUNNER_TEMP/box_key.pub" > /dev/null
          sudo chmod 600 /root/.ssh/authorized_keys
          printf 'Host alder-systemd-box\n  HostName 127.0.0.1\n  User root\n  IdentityFile %s\n  IdentitiesOnly yes\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  LogLevel ERROR\n' "$RUNNER_TEMP/box_key" > "$RUNNER_TEMP/ssh_config"
          ssh -F "$RUNNER_TEMP/ssh_config" alder-systemd-box 'id -un; systemctl is-system-running || true'
      - name: go test (systemd units and a real Caddy)
        env:
          ALDER_DEPLOY_SYSTEMD: "1"
          ALDER_SSH_CONFIG: ${{ runner.temp }}/ssh_config
        run: go test ./cmd/alder -run '^TestDeploySystemd_' -count=1 -timeout 15m -v
      - name: report a failure (the job is non-blocking)
        if: failure()
        run: |
          echo "::warning title=deploy-systemd::deploy-systemd failed (non-blocking until its first green run)"
          echo "deploy-systemd failed (non-blocking until its first green run)" >> "$GITHUB_STEP_SUMMARY"
