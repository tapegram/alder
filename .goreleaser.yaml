# GoReleaser: how a version of alder is cut (book chapter 11, "Cutting a release").
#
# Pushing a tag vX.Y.Z runs .github/workflows/release.yml, which runs this file: it builds
# cmd/alder for every target below, archives each with a checksum, writes the GitHub release
# (notes from the commits since the previous tag), pushes a Homebrew formula to
# tapegram/homebrew-alder and pushes the container image ghcr.io/tapegram/alder:<version>.
#
# Locally: `goreleaser release --snapshot --clean --skip=docker` builds everything into dist/
# and publishes nothing.
#
# No -ldflags: `alder version` reads the version from the build information the go command
# records (internal/version). A build at a clean tag records the tag as the module version.
version: 2

project_name: alder

before:
  hooks:
    - go mod download

builds:
  - id: alder
    main: ./cmd/alder
    binary: alder
    env:
      - CGO_ENABLED=0 # modernc.org/sqlite is pure Go
    flags:
      - -trimpath
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      # windows/amd64 builds; running alder on Windows is untested (book chapter 11).
      - goos: windows
        goarch: arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: alder
    ids: [alder]
    name_template: "alder_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "alder_{{ .Version }}_checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^Merge "

release:
  github:
    owner: tapegram
    name: alder
  draft: false
  prerelease: auto

# The formula goes to tapegram/homebrew-alder (`brew install tapegram/alder/alder`). Pushing
# there needs a token with write access to that repository: the HOMEBREW_TAP_TOKEN secret of
# tapegram/alder (GITHUB_TOKEN reaches only the repository the workflow runs in).
brews:
  - name: alder
    ids: [alder]
    repository:
      owner: tapegram
      name: homebrew-alder
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/tapegram/alder"
    description: "A small, strict language for server-rendered web applications"
    license: "Apache-2.0"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "alder {{ .Tag }}"
    dependencies:
      - name: go # alder build and alder test run go build
    install: |
      bin.install "alder"
    test: |
      system "#{bin}/alder", "version"

# The container image is for CI: Go's official image plus alder, so a pipeline can run
# `alder check`, `alder test` and `alder build` without installing anything (Dockerfile).
dockers_v2:
  - id: alder
    ids: [alder]
    dockerfile: Dockerfile
    images:
      - ghcr.io/tapegram/alder
    tags:
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.source: https://github.com/tapegram/alder
      org.opencontainers.image.description: Go plus alder, for CI
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: Apache-2.0
